  r['Choice Total'] = {gmv: cT, spend: add(r['Choice-NN'].spend, r['Choice-SD'].spend, r['Choice-非NN非SD'].spend, z('zt_c_x'))};
  if (ok) {
    const hT = s('ht'), hS = s('h_sd'), hN = s('h_nsd'), hL = s('h_l12');
    r['海托Total'] = {gmv: hT, spend: s('f_sp'), trBase: s('f_gmv')};
    r['海托SD'] = {gmv: hS, mode: 'none'};
    r['海托非SD'] = {gmv: hN, mode: 'none'};
    r['海托L1&L2'] = {gmv: hL, spend: 0, mode: 'zero'};
    r['海托商家未出资'] = {gmv: sub(hT, hS, hN, hL), spend: 0, mode: 'zero'};
  } else for (const n of ['海托Total','海托SD','海托非SD','海托L1&L2','海托商家未出资']) r[n] = {na: true};
  const pT = s('pop'), pS = s('p_sd'), pL = s('p_l12'), pSp = add(s('p_sd_sp'), z('zt_p_sd'));
  r['Pop Total'] = {gmv: pT, spend: add(pSp, z('zt_p_x'))};
  r['Pop SD'] = {gmv: pS, spend: pSp};
  r['Pop L1&L2'] = {gmv: pL, spend: 0, mode: 'zero'};
  r['Pop 商家未出资'] = {gmv: sub(pT, pS, pL), spend: 0, mode: 'zero'};
  const parts = ok ? ['Choice Total','海托Total','Pop Total'] : ['Choice Total','Pop Total'];
  r['卖场Total'] = {gmv: add(...parts.map(n => r[n].gmv)), spend: add(...parts.map(n => r[n].spend))};
  for (const n of NAMES) { const x = r[n]; if (x.na) continue;
    x.avg = x.gmv === null ? null : x.gmv / ds.length;
    x.tr = x.mode === 'zero' ? (x.gmv === null ? null : 0) : x.mode === 'none' || x.spend === undefined ? null : ratio(x.spend, x.trBase ?? x.gmv); }
  return r;
}

function same(region, ds, ly) {
  const C = D.regions[region], s = f => S(f, C, ds), ok = htOk(region);
  const ch = s('choice'), nn = s('nn_tag'), sd = s(ly ? 'ly_c_sd' : 'c_sd'), pl = s(ly ? 'ly_c_plain' : 'c_plain');
  const ht = ok ? s('ht') : null, hs = s(ly ? 'ly_h_sd' : 'h_sd'), hn = s(ly ? 'ly_h_nsd' : 'h_nsd');
  const pop = s('pop'), ps = s(ly ? 'ly_p_sd' : 'p_sd');
  const cRest = sub(ch, nn, sd, pl), hRest = sub(ht, hs, hn), pRest = sub(pop, ps);
  return {'卖场Total': ok ? add(ch, ht, pop) : add(ch, pop), 'Choice Total': ch, 'Choice-NN': nn, 'Choice-SD': sd,
    'Choice-非NN非SD': pl, 'Choice L1&L2': cRest, 'Choice 商家未出资': cRest, '海托Total': ht, '海托SD': hs, '海托非SD': hn,
    '海托L1&L2': hRest, '海托商家未出资': hRest, 'Pop Total': pop, 'Pop SD': ps, 'Pop L1&L2': pRest, 'Pop 商家未出资': pRest};
}

function compute(region) {
  const cur = days(ymd(state.s), ymd(state.e));
  const mom = days(shift(cur[0], -1, 0), shift(cur[cur.length-1], -1, 0));
  const ly = days(shift(cur[0], 0, -1), shift(cur[cur.length-1], 0, -1));
  const a = period(region, cur), b = period(region, mom), sc = same(region, cur, false), sl = same(region, ly, true);
  const market = a['卖场Total'].gmv;
  const out = {};
  for (const n of NAMES) {
    const x = a[n]; if (x.na) { out[n] = {na: true}; continue; }
    const y = b[n];
    out[n] = {avg: x.avg, gmv: x.gmv, tr: x.tr, share: ratio(x.gmv, market),
      mom: x.avg === null || y.avg === null || !y.avg ? null : x.avg / y.avg - 1,
      trd: x.tr === null || y.tr === null || x.mode ? null : x.tr - y.tr,
      yoy: sc[n] === null || sl[n] === null || sl[n] <= 0 ? null : sc[n] / sl[n] - 1,
      lyAvg: sl[n] === null ? null : sl[n] / ly.length};
  }
  return {rows: out, cur, mom, ly};
}

const fmt = (v, k) => v === null || v === undefined ? '—' :
  k === 'pct' ? (v ? (v > 0 ? '+' : '') + (v * 100).toFixed(2) + '%' : '0.00%') :
  k === 'rate' ? (v * 100).toFixed(2) + '%' : k === 'pt' ? (v >= 0 ? '+' : '') + (v * 100).toFixed(2) + 'pt' :
  v.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const light = v => v === null || v === undefined ? '—' : '<span class="dot ' + (v > 0 ? 'up' : 'down') + '"></span>' + fmt(v, 'pct');
const big = v => v === null ? '—' : v >= 1e6 ? '$' + (v / 1e6).toFixed(2) + 'M' : '$' + (v / 1e3).toFixed(1) + 'K';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderTable(results) {
  const regs = state.regions;
  let h = '<table><thead><tr><th rowspan="2" class="label">分层</th>' + regs.map(r => '<th colspan="6" class="gap">' + esc(r) + '</th>').join('') + '</tr><tr>' +
    regs.map(() => '<th class="gap">日均GMV</th><th>GMV占比</th><th>GMV月环比</th><th>GMV年同比</th><th>TR</th><th>TR月环比差值</th>').join('') + '</tr></thead><tbody>';
  for (const n of NAMES) {
    const label = n.endsWith('L1&L2') ? 'L1&L2' : n.endsWith('商家未出资') ? '商家未出资' : n;
    const cls = n === '卖场Total' ? 'market' : n.endsWith('Total') ? 'total' : 'leaf';
    h += '<tr class="' + cls + '"><td class="label">' + esc(label) + '</td>';
    for (const r of regs) {
      const x = results[r].rows[n];
      if (x.na) { h += '<td class="gap na">不适用</td>' + '<td class="na">—</td>'.repeat(5); continue; }
      h += '<td class="gap">' + fmt(x.avg) + '</td><td>' + fmt(x.share, 'rate') + '</td><td>' + light(x.mom) + '</td>';
      if (n.endsWith('L1&L2')) h += '<td class="merged" rowspan="2" title="L1&L2与商家未出资合并年同比">' + light(x.yoy) + '</td>';
      else if (!n.endsWith('商家未出资')) h += '<td>' + light(x.yoy) + '</td>';
      h += '<td>' + fmt(x.tr, 'rate') + '</td><td>' + fmt(x.trd, 'pt') + '</td>';
    }
    h += '</tr>';
  }
  document.getElementById('table').innerHTML = h + '</tbody></table>';
}

function renderCards(res, region) {
  const r = res.rows, c = (k, n, extra) => {
    const x = r[n]; if (x.na) return '<div class="card"><div class="k">' + k + '</div><div class="v">不适用</div><div class="s">该地域无海托业务</div></div>';
    return '<div class="card"><div class="k">' + esc(region) + '｜' + k + '日均GMV</div><div class="v">' + big(x.avg) + '</div><div class="s">月环比 ' + light(x.mom) +
      '<br>年同比 ' + light(x.yoy) + '<br>TR ' + fmt(x.tr, 'rate') + (extra || '') + '</div></div>'; };
  document.getElementById('cards').innerHTML = c('卖场', '卖场Total', '｜占比100%') + c('Choice ', 'Choice Total', '｜占比 ' + fmt(r['Choice Total'].share, 'rate')) +
    c('Choice-NN ', 'Choice-NN', '｜占比 ' + fmt(r['Choice-NN'].share, 'rate')) + c('海托 ', '海托Total', r['海托Total'].na ? '' : '｜占比 ' + fmt(r['海托Total'].share, 'rate')) +
    c('Pop ', 'Pop Total', '｜占比 ' + fmt(r['Pop Total'].share, 'rate'));
}

function renderTrend(res, region) {
  const C = D.regions[region], ok = htOk(region);
  const val = d => add(S('choice', C, [d]), S('pop', C, [d]), ok ? S('ht', C, [d]) : 0);
  const a = res.cur.map(val), b = res.cur.map(d => val(shift(d, 0, -1)));
  const W = Math.max(document.getElementById('trend').clientWidth || 1000, 600), H = 220, L = 64, R = 16, T = 12, B = 28;
  const all = a.concat(b).filter(v => v !== null), max = Math.max(...all) * 1.08 || 1, n = a.length;
  const X = i => L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1)), Y = v => T + (H - T - B) * (1 - v / max);
  const line = (arr, col) => { let p = '', pen = false; arr.forEach((v, i) => { if (v === null) { pen = false; return; } p += (pen ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1); pen = true; });
    return '<path d="' + p + '" fill="none" stroke="' + col + '" stroke-width="2"/>' + arr.map((v, i) => v === null ? '' : '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="2.6" fill="' + col + '"><title>' + iso(i < n ? (col === '#24445c' ? res.cur[i] : shift(res.cur[i], 0, -1)) : '') + '  ' + big(v) + '</title></circle>').join(''); };
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = max * k / 4; g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="#e3e9ef"/><text x="' + (L - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + big(v) + '</text>'; }
  const step = Math.max(1, Math.ceil(n / 12));
  res.cur.forEach((d, i) => { if (i % step === 0 || i === n - 1) g += '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + d.slice(4,6) + '/' + d.slice(6) + '</text>'; });
  document.getElementById('trendTitle').textContent = region + '｜逐日卖场GMV（订单表；2025年同月同日对比）';
  document.getElementById('trend').innerHTML = '<svg width="' + W + '" height="' + H + '">' + g + line(b, '#c9a227') + line(a, '#24445c') + '</svg>';
}

function render() {
  const res = {}; for (const r of state.regions) res[r] = compute(r);
  const any = res[state.regions[0]], warn = [];
  if (any.mom[0] < '20260801') warn.push('月环比基期含8/1之前：7月只有订单模式GMV，分层月环比与TR差值显示—');
  if (any.ly[0] < '20251001') warn.push('去年对比期早于2025-10-01：SD/海托分层及合并残差年同比显示—（去年圈品清单仅覆盖10月）');
  if (!D.f.nn_sp) warn.push('NN投资未取到：NN、Choice Total、卖场Total的TR显示—');
  const r0 = s => iso(s[0]) + ' 至 ' + iso(s[s.length-1]);
  document.getElementById('period').innerHTML = '当期 <strong>' + r0(any.cur) + '</strong>（' + any.cur.length + '天）｜月环比基期 <strong>' + r0(any.mom) + '</strong>（' + any.mom.length +
    '天，按日均比）｜年同比基期 <strong>' + r0(any.ly) + '</strong>' + (warn.length ? '<br><span class="warn">⚠ ' + warn.join('；') + '</span>' : '');
  renderCards(any, state.regions[0]); renderTrend(any, state.regions[0]); renderTable(res);
}

function init() {
  const box = document.getElementById('regions');
  for (const r of Object.keys(D.regions)) { const b = document.createElement('button'); b.className = 'chip'; b.textContent = r; b.dataset.r = r;
    b.onclick = () => { const i = state.regions.indexOf(r);
      if (i >= 0) { if (state.regions.length > 1) state.regions.splice(i, 1); } else state.regions.push(r);
      state.regions.sort((x, y) => Object.keys(D.regions).indexOf(x) - Object.keys(D.regions).indexOf(y)); sync(); };
    box.appendChild(b); }
  const all = document.createElement('button'); all.className = 'qb'; all.textContent = '全部地域';
  all.onclick = () => { state.regions = Object.keys(D.regions); sync(); }; box.appendChild(all);
  const ds = document.getElementById('ds'), de = document.getElementById('de');
  for (const el of [ds, de]) { el.min = D.min; el.max = D.max; el.onchange = () => {
    let s = ds.value || D.min, e = de.value || D.max; s = s < D.min ? D.min : s > D.max ? D.max : s; e = e < D.min ? D.min : e > D.max ? D.max : e;
    if (s > e) [s, e] = el === ds ? [s, s] : [e, e]; state.s = s; state.e = e; sync(); }; }
  const back = n => { const t = new Date(D.max + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() - n + 1); const v = t.toISOString().slice(0, 10); return v < D.min ? D.min : v; };
  const quick = [['10月MTD', '2026-10-01', D.max], ['9月全月', '2026-09-01', '2026-09-30'], ['8月全月', '2026-08-01', '2026-08-31'],
    ['近7天', back(7), D.max], ['近14天', back(14), D.max], ['近30天', back(30), D.max], ['8/1至今', D.min, D.max]];
  const q = document.getElementById('quick');
  for (const [k, s, e] of quick) { const b = document.createElement('button'); b.className = 'qb'; b.textContent = k; b.onclick = () => { state.s = s; state.e = e; sync(); }; q.appendChild(b); }
  document.getElementById('ztOn').onclick = () => { state.zt = true; sync(); };
  document.getElementById('ztOff').onclick = () => { state.zt = false; sync(); };
  document.getElementById('notes').innerHTML = NOTES.map(n => '<li>' + esc(n) + '</li>').join('');
  window.addEventListener('resize', () => renderTrend(compute(state.regions[0]), state.regions[0]));
  sync();
}
function sync() {
  document.getElementById('ds').value = state.s; document.getElementById('de').value = state.e;
  for (const b of document.querySelectorAll('.chip[data-r]')) b.classList.toggle('on', state.regions.includes(b.dataset.r));
  document.getElementById('ztOn').classList.toggle('on', state.zt); document.getElementById('ztOff').classList.toggle('on', !state.zt);
  render();
}
init();
</script></body></html>

  const all = a.concat(b).filter(v => v !== null), max = Math.max(...all) * 1.08 || 1, n = a.length;
  const X = i => L + (n === 1 ? (W - L - R) / 2 : i * (W - L - R) / (n - 1)), Y = v => T + (H - T - B) * (1 - v / max);
  const line = (arr, col) => { let p = '', pen = false; arr.forEach((v, i) => { if (v === null) { pen = false; return; } p += (pen ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1); pen = true; });
    return '<path d="' + p + '" fill="none" stroke="' + col + '" stroke-width="2"/>' + arr.map((v, i) => v === null ? '' : '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="2.6" fill="' + col + '"><title>' + iso(i < n ? (col === '#24445c' ? res.cur[i] : shift(res.cur[i], 0, -1)) : '') + '  ' + big(v) + '</title></circle>').join(''); };
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = max * k / 4; g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="#e3e9ef"/><text x="' + (L - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + big(v) + '</text>'; }
  const step = Math.max(1, Math.ceil(n / 12));
  res.cur.forEach((d, i) => { if (i % step === 0 || i === n - 1) g += '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + d.slice(4,6) + '/' + d.slice(6) + '</text>'; });
  document.getElementById('trendTitle').textContent = region + '｜逐日卖场GMV（订单表；2025年同月同日对比）';
  document.getElementById('trend').innerHTML = '<svg width="' + W + '" height="' + H + '">' + g + line(b, '#c9a227') + line(a, '#24445c') + '</svg>';
}

function render() {
  const res = {}; for (const r of state.regions) res[r] = compute(r);
  const any = res[state.regions[0]], warn = [];
  if (any.mom[0] < '20260801') warn.push('月环比基期含8/1之前：7月只有订单模式GMV，分层月环比与TR差值显示—');
  if (any.ly[0] < ymd(D.lyCover[0]) || any.ly[any.ly.length-1] > ymd(D.lyCover[1])) warn.push('去年对比期超出' + D.lyCover[0] + '至' + D.lyCover[1] + '：Choice-SD、Pop SD年同比显示—（去年圈品清单仅覆盖10月）');
  warn.push('海托SD/非SD新口径的去年有效邀约与SD月快照尚未核验：年同比显示—，海托Total同比不受影响');
  if (any.cur[any.cur.length-1] > D.cfgEnd) warn.push(iso(D.cfgEnd) + '之后的圈品活动/邀约配置未更新：Choice-SD、非NN非SD、Pop SD分层仅供参考');
  if (!D.f.nn_sp) warn.push('NN投资未取到：NN、Choice Total、卖场Total的TR显示—');
  const r0 = s => iso(s[0]) + ' 至 ' + iso(s[s.length-1]);
  document.getElementById('period').innerHTML = '当期 <strong>' + r0(any.cur) + '</strong>（' + any.cur.length + '天）｜月环比基期 <strong>' + r0(any.mom) + '</strong>（' + any.mom.length +
    '天，按日均比）｜年同比基期 <strong>' + r0(any.ly) + '</strong>' + (warn.length ? '<br><span class="warn">⚠ ' + warn.join('；') + '</span>' : '');
  renderCards(any, state.regions[0]); renderTrend(any, state.regions[0]); renderTable(res);
}

function init() {
  const box = document.getElementById('regions');
  for (const r of Object.keys(D.regions)) { const b = document.createElement('button'); b.className = 'chip'; b.textContent = r; b.dataset.r = r;
    b.onclick = () => { const i = state.regions.indexOf(r);
      if (i >= 0) { if (state.regions.length > 1) state.regions.splice(i, 1); } else state.regions.push(r);
      state.regions.sort((x, y) => Object.keys(D.regions).indexOf(x) - Object.keys(D.regions).indexOf(y)); sync(); };
    box.appendChild(b); }
  const all = document.createElement('button'); all.className = 'qb'; all.textContent = '全部地域';
  all.onclick = () => { state.regions = Object.keys(D.regions); sync(); }; box.appendChild(all);
  const ds = document.getElementById('ds'), de = document.getElementById('de');
  for (const el of [ds, de]) { el.min = D.min; el.max = D.max; el.onchange = () => {
    let s = ds.value || D.min, e = de.value || D.max; s = s < D.min ? D.min : s > D.max ? D.max : s; e = e < D.min ? D.min : e > D.max ? D.max : e;
    if (s > e) [s, e] = el === ds ? [s, s] : [e, e]; state.s = s; state.e = e; sync(); }; }
  const back = n => { const t = new Date(D.max + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() - n + 1); const v = t.toISOString().slice(0, 10); return v < D.min ? D.min : v; };
  const quick = [];
  for (let m = D.max.slice(0, 7); m >= D.min.slice(0, 7); m = shift(ymd(m + '-01'), -1, 0).slice(0, 4) + '-' + shift(ymd(m + '-01'), -1, 0).slice(4, 6)) {
    const last = iso(shift(ymd(m + '-01'), 1, 0)).slice(0, 8) + '01', end = new Date(Date.parse(last + 'T00:00:00Z') - 864e5).toISOString().slice(0, 10);
    const full = end <= D.max;
    quick.push([+m.slice(5) + '月' + (full ? '全月' : 'MTD'), m + '-01' < D.min ? D.min : m + '-01', full ? end : D.max]);
  }
  quick.push(['近7天', back(7), D.max], ['近14天', back(14), D.max], ['近30天', back(30), D.max], [+D.min.slice(5, 7) + '/' + +D.min.slice(8) + '至今', D.min, D.max]);
  const q = document.getElementById('quick');
  for (const [k, s, e] of quick) { const b = document.createElement('button'); b.className = 'qb'; b.textContent = k; b.onclick = () => { state.s = s; state.e = e; sync(); }; q.appendChild(b); }
  document.getElementById('ztOn').onclick = () => { state.zt = true; sync(); };
  document.getElementById('ztOff').onclick = () => { state.zt = false; sync(); };
  document.getElementById('notes').innerHTML = NOTES.map(n => '<li>' + esc(n) + '</li>').join('');
  window.addEventListener('resize', () => renderTrend(compute(state.regions[0]), state.regions[0]));
  sync();
}
function sync() {
  document.getElementById('ds').value = state.s; document.getElementById('de').value = state.e;
  for (const b of document.querySelectorAll('.chip[data-r]')) b.classList.toggle('on', state.regions.includes(b.dataset.r));
  document.getElementById('ztOn').classList.toggle('on', state.zt); document.getElementById('ztOff').classList.toggle('on', !state.zt);
  render();
}
init();
</script></body></html>
